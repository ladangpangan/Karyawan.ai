# Hermes Agent (github.com/NousResearch/hermes-agent) — gateway + dashboard.
#
# Data Hermes (config.yaml, .env, SOUL.md, memories/, skills/, cron/, sessions/)
# hidup di HERMES_DATA_DIR di host (default ~/.hermes), bukan di repo.
# Folder hermes-agent/config, skills, memories, cron di repo ini adalah
# salinan yang di-versioning; pakai `make hermes-restore` untuk menyalinnya
# ke HERMES_DATA_DIR.
#
# network_mode: host agar Hermes bisa memanggil n8n (localhost:5678) dan
# Multica (localhost:8080) langsung.

services:
  hermes-gateway:
    image: nousresearch/hermes-agent:${HERMES_IMAGE_TAG:-latest}
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${HERMES_DATA_DIR:-~/.hermes}:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    command: ["gateway", "run"]

  hermes-dashboard:
    image: nousresearch/hermes-agent:${HERMES_IMAGE_TAG:-latest}
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      - hermes-gateway
    volumes:
      - ${HERMES_DATA_DIR:-~/.hermes}:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    command: ["dashboard", "--host", "127.0.0.1", "--no-open"]
